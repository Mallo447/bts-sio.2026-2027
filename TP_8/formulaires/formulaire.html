<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="style.css">
	<title> Ajoute d'une nouvelle voiture - Méditerranée </title>
</head>
<body>
<header>
	<font>
		<h1> Inscription d'un Nouveau client </h1> <br>
		</font>
</header>

<section>
	<form action="#" method="post">
	<table width="60%" border="0">
		<tr> <td> <label for="marque"> Marque : </label> </td> 
			 <td> <select id="marque" name="marque">
			<option value="peugeot"> Peugeot </option>
			<option value="mercedes"> Mercedes </option>
			<option value="renault"> Renault </option>
		</tr>

		<tr> <td> <label for="immatriculation"> Immatriculation : </label> </td> 
			 <td> <input type="text" id="immatriculation" name="immatriculation"> </td> 
		</tr>

		<tr> <td> <label for="couleur"> Couleur : </label> </td> 
			 <td> <input type="text" id="couleur" name="couleur"> </td> 
		</tr>

				<tr> <td> <label for="date_immatriculation"> Date d'immatriculation : </label> </td> 
			 <td> <input type="date" id="date_immatriculation" name="date_immatriculation"></td> 
		</tr>

		<tr> <td> <label for="kilometrage"> kilométrage : </label> </td> 
			 <td> <input type="number" id="kilometrage" name="kilometrage"></td> 
		</tr>

		<tr> <td> <label>État :</label> </td>
        <td> <input type="radio" id="occasion" name="etat" value="occasion">
        	 <label for="occasion">Occasion</label>
       	 	 <input type="radio" id="neuf" name="etat" value="neuf">
        	 <label for="neuf">Neuf</label> </td> 
        </tr>

		<tr> <td> <label>Carburant :</label> </td>
        	 <td> <input type="radio" id="hybride" name="carburant" value="hybride">
        	 <label for="hybride">Hybride</label>
        	<input type="radio" id="electrique" name="carburant" value="electrique">
        	<label for="electrique">Électrique</label>
       	 	<input type="radio" id="diesel" name="carburant" value="diesel">
       		<label for="diesel">Diesel</label>
        	<input type="radio" id="essence" name="carburant" value="essence">
        	<label for="essence">Essence</label> </td> 
        </tr>

		<tr> <td> <label for="boite_vitesse"> Boîte de vitesse : </label> </td> 
			 <td> <select id="boite_vitesse" name="boite_vitesse">
			<option value="manuelle"> Manuelle </option>
			<option value="auto"> Automatique </option>
		</tr>

		<tr> <td> <label for="nombre_porte"> Nombre de porte: </label> </td> 
			 <td> <input type="number" id="nombre_porte" name="nombre_porte"> </td>
		</tr>

		<tr> <td> <label> Radio :</label> </td>
        <td> <input type="radio" id="oui" name="redio" value="oui">
        	 <label for="oui"> Oui</label>
       	 	 <input type="radio" id="non" name="non" value="non">
        	 <label for="non">Non </label> </td> 
        </tr>

        <tr> <td> <label> climatisation :</label> </td>
        <td> <input type="radio" id="oui" name="redio" value="oui">
        	 <label for="oui"> Oui</label>
       	 	 <input type="radio" id="non" name="non" value="non">
        	 <label for="non">Non </label> </td> 
        </tr>

		<tr> <td> <button type="submit"> Enregistrer</button> </td> </tr>
		
		<tr> <td> <button type="reset"> Annuler</button> </td> </tr>
