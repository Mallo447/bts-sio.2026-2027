<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="style.css">
	<title> Inscription d'un nouveau Client - Méditerranée </title>
</head>
<body>
<header>
	<font>
		<h1> Inscription d'un Nouveau client </h1> <br>
		</font>
</header>

<section>
	<form action="#" method="post">
	<table width="50%" border="0">
		<tr> <td> <label for="nom"> Nom : </label> </td> 
			 <td> <input type="text" id="nom" name="nom"> </td> 
		</tr>

		<tr> <td> <label for="prenom"> Prénom : </label> </td> 
			 <td> <input type="text" id="prenom" name="prenom"> </td> 
		</tr>

		<tr> <td> <label for="date_naissance"> Date de naissance : </label> </td> 
			 <td> <input type="date" id="date_naissance" name="date_naissance"></td> 
		</tr>

		<tr> <td> <label for="email"> Adresse mail: </label> </td> 
			 <td> <input type="email" id="email" name="email"> </td>
		</tr>

		<tr> <td> <label for="mdp"> Mots de passe : </label> </td> 
			 <td> <input type="password" id="mdp" name="mdp"> </td> 
		</tr>

		<tr> <td> <label for="permis"> Numéro de premis : </label> </td> 
			 <td>  <input type="text" id="permis" name="permis"> </td> 
		</tr>

		<tr> <td> <label for="anciennete"> Nombre d'années d'ancienneté:</label> </td> 
			 <td> <input type="number" id="anciennete" name="anciennete"> </td>
		</tr>

		<tr> <td> <label for="ville"> Ville : </label> </td> <td> <select id="ville" name="ville">
			<option value="pris"> Paris </option>
			<option value="versailles"> Versailles </option>
			<option value="creteil"> Créteil </option>
		</tr>

		<tr> <td> <label for="adresse"> Adresse du client: </label> </td> 
			 <td> <textarea id="adresse" name="adresse" rows="4" cols="30"></textarea> </td> 
		</tr>

		<tr> <td> <p class="p"> Situation matrimoniale:</p> </td> 
		</tr>

		<tr> <td> <label for="marie_oui"> Marié </label> </td> 
			 <td> <input type="radio" id="marie_oui" name="marie_oui" value="oui"> </td> 
		</tr>

		<tr> <td> <label for="marie_non"> Non marié </label> </td> 
			 <td> <input type="radio" id="marie_non" name="marie_non" value="non"> </td> 
		</tr>

		<tr> 
			<td> <p class="p"> Préférence de voiture:</p> </td> 
		</tr>

		<tr> <td> <label for="pref_auto"> Automatique </label> </td>
		     <td> <input type="checkbox" id="pref_auto" name="pref_auto" value="automatique"> </td> 
		</tr>

		<tr> <td> <label for="pref_manuelle"> Manuelle </label> </td> 
			 <td> <input type="checkbox" id="pref_manuelle" name="pref_manuelle" value="manuelle"> </td> 
			</tr>

		<tr> <td> <button type="submit"> Enregistrer</button> </td> </tr>
		
		<tr> <td> <button type="reset"> Annuler</button> </td> </tr>
	</table> <br> <br>
	<a href="../menu.html"> Retour </a> 
</section>

	<footer>
		<p>&copy; 2026 Agence Méditerranée - Location de véhicules </p>
		</font>
	</footer>
</body>
</html>
